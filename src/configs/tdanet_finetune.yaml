defaults:
  - model: tdanet_ffnonly
  - writer: cometml
  - metrics: example
  - datasets: dataset
  - dataloader: dataloader
  - transforms: transforms_no_augs
  - _self_

data_root: "."
index_dir: "indexes"
aug_dir: "augs"

optimizer:
  cls: torch.optim.Adam
  weight_decay: 0.0
  optimizer_config:
    lr: 1e-6

lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-5
  div_factor: 10
  pct_start: 0.35
  final_div_factor: 100  

loss_function:
  _target_: src.loss.SISNRLoss

trainer:
  log_step: 500
  val_step: 15
  n_epochs: 500
  gradient_accumulation: null
  max_grad_norm: 5
  mixed_precision: float32
  compile: True
  ts_compile: False # врубает торчскриптовский jit. Не работает с автокастом >:(
  device_tensors: ["audio_s1", "audio_s2", "audio_mix"] # which tensors should be on device (ex. GPU)
  resume_from: null # null or path to the checkpoint dir with *.pth and config.yaml
  device: auto # device name or "auto"
  override: True # if True, will override the previous run with the same name
  monitor: "max val_SI-SNRi" # "off" or "max/min metric_name", i.e. our goal is to maximize/minimize metric
  save_period: 30 # checkpoint each save_period epochs in addition to the best epoch
  early_stop: 45 # epochs for early stopping
  save_dir: "saved"
  seed: 1