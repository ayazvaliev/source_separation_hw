train:
  get_mix:
    _target_: src.transforms.Mix
    min_snr_in_db: -4
    max_snr_in_db: 4

  get_spectrogram:
    _target_: src.transforms.LogMelSpecTransform
    sample_rate: 16000
    n_fft: 400
    win_length: 400
    hop_length: 160
    n_mels: 80
    top_db: 80
    power: 2.0

  audio_s1:
    _target_: nn.Sequential
    - _target_: torch_audiomentations.Shift
      min_shift: -0.1
      max_shift: 0.1
      rollover: True
      sample_rate: 16000
      output_type: tensor
      p: 0.5
    - _target_: torch_audiomentations.Gain
      min_gain_in_db: -8.0
      max_gain_in_db: 8.0
      sample_rate: 16000
      output_type: tensor
      p: 0.7
    - _target_: src.transforms.SpeedPertrub
      min_speed: 0.9
      max_speed: 1.10
      sample_rate: 16000
      p: 0.25
    - _target_: torch_audiomentations.PitchShift
      min_semitones: -3.0
      max_semitones: 3.0
      sample_rate: 16000
      output_type: tensor
      p: 0.35
    - _target_: torch_audiomentations.AddColoredNoise
      min_snr_in_db: 25
      max_snr_in_db: 40
      sample_rate: 16000
      output_type: tensor
      p: 0.05
    - _target_: torch_audiomentations.PeakNormalization
      apply_to: only_too_loud_sounds
      sample_rate: 16000
      output_type: tensor
      p: 1.0
  
  audio_s2: ${transforms.train.audio_s1}

  audio_mix:
    _target_: torch_audiomentations.PeakNormalization
    apply_to: only_too_loud_sounds
    sample_rate: 16000
    output_type: tensor
    p: 1.0

inference:
  get_spectrogram: ${transforms.batch_transforms.train.get_spectrogram}
